; Poisson Glouton - compteur de bouteilles
; Environnements display : JC4827W543 (pgl-s3-display), JC3248W535 (pgl-s3-jc3248)
; Secondaire : ESP32-S3 sans ecran (pgl-s3-headless)

[platformio]
default_envs = pgl-s3-display

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_extra_dirs = ../shared
build_flags =
  -I../
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DPGL_APP_NAME=\"poissonglouton\"
lib_deps =
  arduino-libraries/Arduino_JSON@0.2.0
  bblanchon/ArduinoJson@7.4.3

[env:pgl-s3-display]
extends = env
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  ${env.build_flags}
  -DPGL_HEADLESS=0
  -DPGL_BOARD_JC4827W543=1
  -DPGL_IR_PRESENT=1
  -DPGL_VERBOSE_LOG=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
lib_deps =
  ${env.lib_deps}
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.3.0
  lvgl/lvgl@8.4.0
  Moononournation/GFX Library for Arduino@1.6.5

[env:pgl-s3-jc3248]
extends = env
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  ${env.build_flags}
  -DPGL_HEADLESS=0
  -DPGL_BOARD_JC3248W535=1
  -DPGL_BACKLIGHT_TIMEOUT_MS=0
  -DPGL_VERBOSE_LOG=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
lib_deps =
  ${env.lib_deps}
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.3.0
  lvgl/lvgl@8.4.0
  Moononournation/GFX Library for Arduino@1.6.5

; JC3248 bench : logs display detailles + self-test couleurs au boot
[env:pgl-s3-jc3248-debug]
extends = env:pgl-s3-jc3248
build_flags =
  ${env:pgl-s3-jc3248.build_flags}
  -DPGL_DISPLAY_DEBUG=1
  -DPGL_VERBOSE_LOG=1

; Bench / devkit sans ecran integre — pas l'env de production JC4827
[env:pgl-s3-headless]
extends = env
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<pgl_ui.cpp>
build_flags =
  ${env.build_flags}
  -DPGL_HEADLESS=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPGL_VERBOSE_LOG=0

; Dev / bench : veille desactivee, logs verbeux
[env:pgl-s3-debug]
extends = env:pgl-s3-display
build_flags =
  ${env:pgl-s3-display.build_flags}
  -DPGL_DEBUG_NO_SLEEP=1
  -DPGL_VERBOSE_LOG=1

; Variante HTTPS (TLS) opt-in — compile-check CI (WiFiClientSecure + setInsecure).
; HTTP reste le defaut des envs pgl-s3-* sans suffixe -https.
[env:pgl-s3-display-https]
extends = env:pgl-s3-display
build_flags =
  ${env:pgl-s3-display.build_flags}
  -DUSE_HTTPS_ENDPOINTS

[env:pgl-s3-headless-https]
extends = env:pgl-s3-headless
build_flags =
  ${env:pgl-s3-headless.build_flags}
  -DUSE_HTTPS_ENDPOINTS

[env:pgl-s3-jc3248-https]
extends = env:pgl-s3-jc3248
build_flags =
  ${env:pgl-s3-jc3248.build_flags}
  -DUSE_HTTPS_ENDPOINTS

; JC4827 avec capteur PIR branche (GPIO5)
[env:pgl-s3-display-pir]
extends = env:pgl-s3-display
build_flags =
  ${env:pgl-s3-display.build_flags}
  -DPGL_ENABLE_PIR=1

; Headless avec deep sleep active (noeud batterie / bench veille)
[env:pgl-s3-headless-sleep]
extends = env:pgl-s3-headless
build_flags =
  ${env:pgl-s3-headless.build_flags}
  -DPGL_ENABLE_SLEEP=1
  -DPGL_IR_PRESENT=1
