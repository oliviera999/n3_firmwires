; Poisson Glouton - compteur de bouteilles
; Deux environnements: ecran tactile JC4827W543 et headless ESP32-S3

[platformio]
default_envs = pgl-s3-headless

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../shared
build_flags =
  -I../
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DPGL_APP_NAME=\"poissonglouton\"
  -DPGL_ENABLE_DFPLAYER=1
  -DPGL_ENABLE_IR=1
  -DPGL_ENABLE_ULTRASON=1
  -DPGL_ENABLE_HMAC=1
lib_deps =
  fbiego/ESP32Time@2.0.6
  DFRobot/DFRobotDFPlayerMini@1.0.6
  arduino-libraries/Arduino_JSON@0.2.0
  bblanchon/ArduinoJson@7.4.3

[env:pgl-s3-headless]
extends = env
build_flags =
  ${env.build_flags}
  -DPGL_HEADLESS=1

[env:pgl-s3-display]
extends = env
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  ${env.build_flags}
  -DPGL_HEADLESS=0
  -DPGL_DEBUG_NO_SLEEP=1
  -DPGL_VERBOSE_LOG=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
lib_deps =
  ${env.lib_deps}
  lvgl/lvgl@8.4.0
  Moononournation/GFX Library for Arduino@1.6.5
