; Poisson Glouton - compteur de bouteilles
; Environnements display : JC4827W543 (pgl-s3-display), JC3248W535 (pgl-s3-jc3248)
; Secondaire : ESP32-S3 sans ecran (pgl-s3-headless)

[platformio]
default_envs = pgl-s3-display

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_extra_dirs = ../shared
build_flags =
  -I../
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  -DPGL_APP_NAME=\"poissonglouton\"
  -DPGL_ENABLE_IR=1
  -DPGL_ENABLE_ULTRASON=1
  -DPGL_ENABLE_HMAC=1
lib_deps =
  fbiego/ESP32Time@2.0.6
  arduino-libraries/Arduino_JSON@0.2.0
  bblanchon/ArduinoJson@7.4.3

[env:pgl-s3-display]
extends = env
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  ${env.build_flags}
  -DPGL_HEADLESS=0
  -DPGL_BOARD_JC4827W543=1
  -DPGL_DEBUG_NO_SLEEP=1
  -DPGL_VERBOSE_LOG=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
lib_deps =
  ${env.lib_deps}
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.3.0
  lvgl/lvgl@8.4.0
  Moononournation/GFX Library for Arduino@1.6.5

[env:pgl-s3-jc3248]
extends = env
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  ${env.build_flags}
  -DPGL_HEADLESS=0
  -DPGL_BOARD_JC3248W535=1
  -DPGL_AX15231B_INIT_TYPE2=1
  -DPGL_DEBUG_NO_SLEEP=1
  -DPGL_VERBOSE_LOG=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
lib_deps =
  ${env.lib_deps}
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.3.0
  lvgl/lvgl@8.4.0
  Moononournation/GFX Library for Arduino@1.6.5

; Bench / devkit sans ecran integre — pas l'env de production JC4827
[env:pgl-s3-headless]
extends = env
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags =
  ${env.build_flags}
  -DPGL_HEADLESS=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DPGL_DEBUG_NO_SLEEP=1
  -DPGL_VERBOSE_LOG=1
