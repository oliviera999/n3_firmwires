; Tests unitaires hote (Unity) pour poissonglouton — isole du platformio.ini
; principal (cibles ESP32-S3). Calque sur ffp5cs/platformio-native.ini.
;
; Usage :
;   pio test -c platformio-native.ini -e native                 (toutes les suites)
;   pio test -c platformio-native.ini -e native -f test_counter (une suite)
;
; Les sources firmware (src/pgl_counter.cpp, src/pgl_event_journal.cpp) sont
; incluses directement par les fichiers de test et compilees contre les stubs
; hote de test/native_stubs (Arduino/Preferences/SD/WiFi/esp_sleep). UNIT_TEST
; active les accesseurs friend (PglCounterTestAccess / PglJournalTestAccess).
[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_filter = test_journal_logic, test_counter, test_detection_fusion, test_detection_poll
lib_deps =
	throwtheswitch/Unity@^2.6.1
build_flags =
	-std=gnu++17
	-DUNIT_TEST
	-Iinclude
	-Itest/native_stubs
