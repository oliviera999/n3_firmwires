; Tests unitaires natifs (hôte, Unity) pour les bibliothèques partagées shared/.
; Isolé : n'inclut pas les library.json voisins (pas de lib_extra_dirs) ; chaque
; test inclut directement le .cpp testé avec un mock Arduino minimal (mocks/).
;
; Usage (depuis shared/tests_native/) :
;   pio test -c platformio-native.ini -e native
;
[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags =
	-std=gnu++17
	-DUNIT_TEST
	-I mocks
	-I stubs
	-I ../n3_analog_sensors/src
	-I ../n3_hmac/src
	-I ../n3_data/src
	-I ../n3_common/src
	-I ../n3_mail/src
	-I ../n3_time/src
	-I ../n3_store_forward/src
	-I ../n3_upload/src
	-I ../n3_ota_ui/src
	-I ../n3_log/src
	-I ../n3_tracker/src
lib_deps =
	throwtheswitch/Unity@^2.6.1
	; ArduinoJson : header-only, compatible hôte — requis par test_ota_select
	; (n3_common/n3_ota_artifact_select.h). Aligné sur le pin des firmwares.
	bblanchon/ArduinoJson@7.4.3
