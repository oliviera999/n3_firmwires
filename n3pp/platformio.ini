; PlatformIO Project Configuration — N3PhasmesProto (N3PP)
; Carte : ESP32 (esp32dev). Serre / aquaponie.
; Build Windows : sortie sous C:\pio-builds\n3pp\<env>\ (firmwires/scripts/pio_redirect_build_dir.py).
; Desactiver : N3_PIO_BUILD_REDIRECT=0 ; racine : N3_PIO_BUILD_ROOT.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = ../config/partitions/min_spiffs.csv
lib_extra_dirs = ../shared
build_flags =
	-I../
	; AsyncTCP + Arduino-ESP32 3.3 : macro requise a la compile des lib_deps
	-DCONFIG_ESP_TASK_WDT_TIMEOUT_S=30
	-DUSE_HTTPS_ENDPOINTS
extra_scripts =
	pre:../scripts/pio_redirect_build_dir.py
	pre:../scripts/pio_patch_esp_mail_fs_spiffs.py
	pre:scripts/upload_hook_otadata.py

lib_deps =
	bblanchon/ArduinoJson@7.4.3
	ESP32Async/AsyncTCP@3.4.10
	ESP32Async/ESPAsyncWebServer@3.10.0
	adafruit/Adafruit Unified Sensor@1.1.15
	adafruit/DHT sensor library@1.4.7
	adafruit/Adafruit GFX Library@1.12.5
	adafruit/Adafruit SSD1306@2.5.16
	adafruit/Adafruit BusIO@1.17.4
	fbiego/ESP32Time@2.0.6
	arduino-libraries/Arduino_JSON@0.2.0
	mobizt/ESP Mail Client@3.4.24

lib_ignore = WebServer

[env:esp32dev_test]
extends = env:esp32dev
build_flags =
	-I../
	-DTEST_MODE
	-DCONFIG_ESP_TASK_WDT_TIMEOUT_S=30

; Variante HTTPS (TLS) opt-in — herite de esp32dev + flag USE_HTTPS_ENDPOINTS.
; Sert de compile-check CI pour le chemin TLS (WiFiClientSecure + setInsecure).
; HTTP reste le defaut : ne pas flasher en prod sans validation cible (vrai
; handshake TLS + donnees recues). Voir docs/HTTPS_MIGRATION.md.
[env:n3pp-https]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-DUSE_HTTPS_ENDPOINTS
