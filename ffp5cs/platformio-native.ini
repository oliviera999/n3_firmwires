; Tests unitaires hôte (Unity) — isolé du [env] Arduino du platformio.ini principal.
; Usage : pio test -c platformio-native.ini -e native
[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_filter = test_nvs, test_config, test_server_url, test_sensor_validation, test_feeding_slots, test_post_body, test_gpio_mapping, test_sensor_fallback, test_ota_select, test_gpio_lookup, test_sensor_map, test_data_queue, test_display_cache, test_ota_config, test_utils, test_gpio_registry, test_server_hostname, test_ultrasonic_filter, test_ota_url, test_sd_queue_path, test_epoch_util, test_reset_reason, test_unit_convert, test_sleep_decision, test_flood_alert, test_reservoir_low_security, test_heater_hysteresis, test_level_alert, test_iactuators, test_actuator_snapshot, test_feeding_timing, test_threshold_util, test_refill_start, test_refill_duration
lib_deps =
	throwtheswitch/Unity@^2.6.1
	bblanchon/ArduinoJson@7.4.2
build_flags =
	-std=gnu++17
	-DUNIT_TEST
	-Iinclude
	-Itest/unit
	-Itest/test_config
	-Itest/test_nvs
	-Itest/test_server_url
	-Itest/test_sensor_validation
	-Itest/test_feeding_slots
	-Itest/test_post_body
	-Itest/test_gpio_mapping
	-Itest/test_sensor_fallback
	-Itest/test_ota_select
	-Itest/test_gpio_lookup
	-Itest/test_sensor_map
	-Itest/test_data_queue
	-Itest/test_display_cache
	-Itest/test_ota_config
	-Itest/test_utils
	-Itest/test_gpio_registry
	-Itest/test_server_hostname
	-Itest/test_ultrasonic_filter
	-Itest/test_ota_url
	-Itest/test_sd_queue_path
	-Itest/test_epoch_util
	-Itest/test_reset_reason
	-Itest/test_unit_convert
	-Itest/test_sleep_decision
	-Itest/test_flood_alert
	-Itest/test_reservoir_low_security
	-Itest/test_heater_hysteresis
	-Itest/test_level_alert
	-Itest/test_iactuators
	-Itest/test_actuator_snapshot
	-Itest/test_feeding_timing
	-Itest/test_threshold_util
	-Itest/test_refill_start
	-Itest/test_refill_duration
