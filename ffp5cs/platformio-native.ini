; Tests unitaires hôte (Unity) — isolé du [env] Arduino du platformio.ini principal.
; Usage : pio test -c platformio-native.ini -e native
[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_filter = test_nvs, test_config, test_server_url, test_sensor_validation, test_feeding_slots, test_post_body, test_gpio_mapping, test_sensor_fallback, test_data_queue, test_display_cache, test_ota_config
lib_deps = throwtheswitch/Unity@^2.6.1
build_flags =
	-std=gnu++17
	-DUNIT_TEST
	-Iinclude
	-Itest/unit
	-Itest/test_config
	-Itest/test_nvs
	-Itest/test_server_url
	-Itest/test_sensor_validation
	-Itest/test_feeding_slots
	-Itest/test_post_body
	-Itest/test_gpio_mapping
	-Itest/test_sensor_fallback
	-Itest/test_data_queue
	-Itest/test_display_cache
	-Itest/test_ota_config
