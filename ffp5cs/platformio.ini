; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; ============================================================================
; FFP5CS - Matrice des environnements (voir VERSION.md ; firmware courant v13.92)
; ============================================================================
; Production WROOM ......... wroom-prod      ESP32-WROOM, DHT11 (USE_DHT22 optionnel), /post-data (HTTP ; préfixe /ffp3/ retiré v13.87, cf. server_url_config.h)
; Production WROOM HTTPS ... wroom-prod-https profil prepare, bloque v13.81 sans TLS WebClient
; Test WROOM ............... wroom-test      ESP32-WROOM, debug + web async, endpoints test
; Bêta WROOM (OTA) ......... wroom-beta      ESP32-WROOM, canal OTA test (USE_TEST_ENDPOINTS)
; Bêta local Docker ........ wroom-beta-local idem beta + USE_LOCAL_SERVER_ENDPOINTS
; Production S3 ............ wroom-s3-prod   ESP32-S3 16Mo (sans PSRAM), endpoints /post-data3 (préfixe /ffp3/ retiré v13.87)
; Test S3 .................. wroom-s3-test   ESP32-S3 16Mo, debug, endpoints s3test ou test3 selon flag
; Test S3 + PSRAM .......... wroom-s3-test-psram   PSRAM 8Mo activée, patches IWDT
; Test S3 + PSRAM v2 ....... wroom-s3-test-psram-v2  Variante sans patches IWDT (à valider)
; Test S3 + 8Mo DevKit ..... wroom-s3-test-devkit  S3 DevKit 8Mo flash
; Test S3 + USB JTAG ....... wroom-s3-test-usb    Upload/debug via USB built-in JTAG
; Test TLS minimal ......... wroom-tls-test  Build tls_minimal_test.cpp seul (diagnostic)
;
; Pour livraison : wroom-prod / wroom-s3-prod (jamais wroom-test ou wroom-beta-local).
; `default_envs = wroom-test` est le défaut DEV uniquement.
; ============================================================================

[platformio]
default_envs = wroom-test
; Cache de compilation hors du clone (alternance n3pp / ffp5cs plus rapide)
build_cache_dir = C:/pio-builds/.pio-cache/ffp5cs

; Dépendances communes à tous les envs ffp5cs (WROOM + S3), SANS la lib servo :
; ESP32Servo diffère selon la toolchain (arduino-esp32 3.x pour WROOM vs 2.0.x
; pour S3) et est donc ajoutée par périmètre ([env] pour WROOM, wroom-s3-base pour S3).
[common]
lib_deps =
	; v13.60 (audit): libs Async épinglées (étaient flottantes — régressions silencieuses).
	; Versions validées avec arduino-esp32 3.3.7 (WROOM pioarduino) et 2.0.x (S3 espressif32).
	ESP32Async/AsyncTCP@3.4.10
	ESP32Async/ESPAsyncWebServer@3.7.6
	adafruit/Adafruit Unified Sensor@1.1.14
	adafruit/DHT sensor library@1.4.6
	adafruit/Adafruit GFX Library@1.11.10
	adafruit/Adafruit SSD1306@2.5.9
	adafruit/Adafruit BusIO@1.17.4
	paulstoffregen/OneWire@2.3.8
	milesburton/DallasTemperature@3.11.0
	fbiego/ESP32Time@2.0.0
	bblanchon/ArduinoJson@7.4.2
	; Arduino_JSON (officielle, distincte de bblanchon/ArduinoJson) : requise par
	; shared/n3_common/n3_outputs_json, tiré transitivement depuis v14.25 via la
	; mutualisation SMTP n3_mail -> n3_data -> n3_common. Aligné sur n3pp/msp/upload.
	arduino-libraries/Arduino_JSON@0.2.0
	mobizt/ESP Mail Client@3.4.24
	links2004/WebSockets@2.7.0

[env]
platform = platformio/espressif32@6.13.0
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_raw = 0
board_build.filesystem = littlefs
board_build.cpp_standard = cpp17
build_src_filter = 
	+<*>
	-<tls_minimal_test.cpp>
platform_packages = 
	platformio/tool-mklittlefs @ 1.203.210628
extra_scripts = 
	pre:../scripts/pio_repair_build_junction.py
	pre:../scripts/pio_redirect_build_dir.py
	pre:tools/pio_ensure_secrets.py
	pre:tools/pio_build_epoch.py
	pre:tools/pio_add_mklittlefs_path.py
	pre:tools/pio_restore_build_config.py
	pre:tools/pio_wroom_upload_bundle.py
	pre:tools/pio_ensure_git_data.py
	post:tools/pio_save_boot_artifacts.py
	post:tools/pio_verify_wroom_sdkconfig.py
	post:tools/pio_repair_junction_on_clean.py
	pre:tools/s3_patch_esp_insights_mqtt.py
	pre:tools/s3_patch_wpa_supplicant_wno_error.py
	post:tools/pio_write_build_version.py
	post:tools/pio_check_flash_budget.py
build_unflags =
	-Os
	-std=gnu++11
build_flags = 
	-std=gnu++17
	-Iinclude
	-O1
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	-fno-exceptions
	-fno-rtti
	-fno-threadsafe-statics
	-fno-use-cxa-atexit
	-Wno-deprecated-declarations
	-DSILENT_MODE
	-DASYNCWEBSERVER_REGEX=0
	-DconfigCHECK_FOR_STACK_OVERFLOW=2
	-DFEATURE_OLED=1
	-DFEATURE_MAIL=1
	-DFEATURE_OTA=1
	-DFEATURE_HTTP_OTA=1
	-DFEATURE_WIFI_APSTA=0
	-DWIFI_MODEM_SLEEP_ENABLED=0
lib_extra_dirs = ../shared
lib_deps =
	${common.lib_deps}
	; Servo WROOM : arduino-esp32 3.x (pioarduino 3.3.7). Le périmètre S3 rétrograde
	; en 1.2.1 (arduino-esp32 2.0.x) — cf. [env:wroom-s3-base].
	madhephaestus/ESP32Servo@3.0.5
lib_ignore =
	WebServer

[env:wroom-prod]
board = esp32dev
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
platform_packages = 
	platformio/tool-mklittlefs @ 1.203.210628
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7.tar.xz
board_build.partitions = config/partitions/partitions_esp32_wroom_ota_fs_mail.csv
custom_sdkconfig = file://sdkconfig_wroom_wdt.txt
lib_ignore = WebServer, ESPAsyncWebServer, WebSockets, LittleFS
; Garde-fou taille binaire (pio_check_flash_budget.py). Mesuré : flash 78,7 %
; (partition fs_mail) -> seuil 85 % = marge anti-régression. NB : la vraie
; contrainte de wroom-prod est la DRAM interne (~99,9 %), gérée par le linker
; (dram0_0_seg), pas le flash.
custom_flash_budget_pct = 85
build_flags = 
	${env.build_flags}
	-Isrc
	-DCONFIG_ESP_TASK_WDT_TIMEOUT_S=30
	-Wno-error
	-std=gnu++17
	-DBOARD_WROOM
	-DPROFILE_PROD
	; DHT11 par défaut (sensor_air.cpp). Ajouter -DUSE_DHT22 si la carte est équipée DHT22.
	-DDISABLE_ASYNC_WEBSERVER
	-DNDEBUG
	-Os
	-DENABLE_SERIAL_MONITOR=0
	-DENABLE_SENSOR_LOGS=0
	-fno-builtin-printf
	-fno-builtin-sprintf
	-fno-builtin-vprintf
	-fno-builtin-vsprintf
	-DCORE_DEBUG_LEVEL=0
	-DLOG_LEVEL=0
	-DFFP5CS_COREDUMP_ENABLE=0
upload_speed = 921600

; Build classique (sans pioarduino 2 passes) — secours si phase 2 échoue.
; Doc : docs/technical/COMPILATION_WROOM_PIOARDUINO_ET_ENVS.md
[env:wroom-prod-pio6]
extends = env:wroom-prod
platform = platformio/espressif32@6.13.0
platform_packages =
	platformio/tool-mklittlefs @ 1.203.210628

[env:wroom-test]
board = esp32dev
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
platform_packages = 
	platformio/tool-mklittlefs @ 1.203.210628
board_build.partitions = config/partitions/partitions_esp32_wroom_test.csv
custom_sdkconfig = file://sdkconfig_wroom_wdt.txt
lib_ignore = LittleFS
; Garde-fou taille binaire (pio_check_flash_budget.py). wroom-test ~51 % de la
; partition 4 Mo : seuil 70 % = marge anti-régression confortable en CI. Les
; partitions prod/S3 (serrées) peuvent définir un seuil propre (~98 %).
custom_flash_budget_pct = 70
build_flags = 
	${env.build_flags}
	-DCONFIG_ESP_TASK_WDT_TIMEOUT_S=30
	-Wno-error
	-std=gnu++17
	-DBOARD_WROOM
	-DPROFILE_TEST
	-DFFP_ENABLE_DANGEROUS_ENDPOINTS
	-DOLED_DIAGNOSTIC
	-Os
	-fno-builtin-printf
	-fno-builtin-sprintf
	-fno-builtin-vprintf
	-fno-builtin-vsprintf
	-DNDEBUG
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
	-DLOG_LEVEL=5
	-DENABLE_SENSOR_LOGS=1
	-DENABLE_SERIAL_MONITOR=1
	-USILENT_MODE
	-DFFP5CS_COREDUMP_ENABLE=0
	-flto
	-ffat-lto-objects
upload_speed = 115200
monitor_filters = time

[env:wroom-s3-base]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = config/partitions/partitions_esp32_s3_test.csv
board_build.filesystem = littlefs
extra_scripts = ${env.extra_scripts}
custom_sdkconfig = 
	file://sdkconfig_s3_wdt.txt
build_flags = 
	${env.build_flags}
	-std=gnu++17
	-DBOARD_S3
	-DUSE_RTC_DS3231
	-DCONFIG_ESP_TASK_WDT_TIMEOUT_S=300
	-DARDUINO_LOOP_STACK_SIZE=32768
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768
	-Os
	-fno-builtin-printf
	-fno-builtin-sprintf
	-fno-builtin-vprintf
	-fno-builtin-vsprintf
	-DNDEBUG
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_USB_MODE=1
	-DFFP5CS_COREDUMP_ENABLE=0
	-flto
	-ffat-lto-objects
upload_speed = 921600
monitor_speed = 115200
lib_deps =
	${common.lib_deps}
	adafruit/Adafruit BME280 Library
	; S3 = espressif32@6.13.0 (arduino-esp32 2.0.x) : ESP32Servo@3.0.5 (WROOM,
	; arduino-esp32 3.x) ne compile pas ici ('note_t' non déclaré dans ESP32PWM.h).
	; On épingle la dernière 1.x compatible 2.0.x pour ce périmètre S3 uniquement.
	madhephaestus/ESP32Servo@1.2.1

[env:wroom-s3-test]
extends = env:wroom-s3-base
board_build.partitions = config/partitions/partitions_esp32_s3_test.csv
lib_ignore = LittleFS
; Partition S3 test 7 Mo (~28 % utilisée) : garde-fou à 50 % (pio_check_flash_budget.py).
custom_flash_budget_pct = 50
build_flags = 
	${env:wroom-s3-base.build_flags}
	-DCONFIG_LITTLEFS_PAGE_SIZE=256
	-DPROFILE_TEST
	-DUSE_TEST3_ENDPOINTS
	-DFFP_ENABLE_DANGEROUS_ENDPOINTS
	-DOLED_DIAGNOSTIC
	-DCORE_DEBUG_LEVEL=1
	-DLOG_LEVEL=5
	-DENABLE_SENSOR_LOGS=1
	-DENABLE_SERIAL_MONITOR=1
	-USILENT_MODE
	-DUSE_AIR_SENSOR_AUTO
	-DFFP5CS_COREDUMP_ENABLE=0
monitor_filters = time

[env:wroom-s3-test-psram]
extends = env:wroom-s3-base
extra_scripts = 
	pre:../scripts/pio_redirect_build_dir.py
	pre:tools/pio_ensure_secrets.py
	pre:tools/pio_add_mklittlefs_path.py
	pre:tools/pio_ensure_lib_dirs_windows.py
	pre:tools/pio_ensure_git_data.py
	pre:tools/s3_patch_esp_insights_mqtt.py
	pre:tools/s3_patch_wpa_supplicant_wno_error.py
	pre:tools/pio_pre_apply_arduino_patches.py
	pre:tools/pio_s3_psram_patch_iwdt.py
	post:tools/pio_write_build_version.py
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.extra_flags = -DBOARD_HAS_PSRAM
board_build.partitions = config/partitions/partitions_esp32_s3_test.csv
board_build.sdkconfig_options = 
	CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
	CONFIG_SPIRAM=y
custom_sdkconfig = file://sdkconfig_s3_wdt_16mb_psram.txt
lib_ignore = LittleFS
build_flags = 
	${env:wroom-s3-base.build_flags}
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DCONFIG_LITTLEFS_PAGE_SIZE=256
	-DPROFILE_TEST
	-DUSE_TEST3_ENDPOINTS
	-DFFP_ENABLE_DANGEROUS_ENDPOINTS
	-DOLED_DIAGNOSTIC
	-DCORE_DEBUG_LEVEL=1
	-DLOG_LEVEL=5
	-DENABLE_SENSOR_LOGS=1
	-DENABLE_SERIAL_MONITOR=1
	-USILENT_MODE
	-DARDUINO_USB_CDC_ON_BOOT=0
monitor_filters = time

[env:wroom-s3-test-psram-v2]
extends = env:wroom-s3-base
extra_scripts = ${env.extra_scripts}
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.extra_flags = -DBOARD_HAS_PSRAM
board_build.partitions = config/partitions/partitions_esp32_s3_test.csv
board_build.sdkconfig_options = 
	CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
	CONFIG_SPIRAM=y
custom_sdkconfig = file://sdkconfig_s3_wdt_16mb_psram.txt
lib_ignore = LittleFS
build_flags = 
	${env:wroom-s3-base.build_flags}
	-DBOARD_HAS_PSRAM
	-DCONFIG_LITTLEFS_PAGE_SIZE=256
	-DPROFILE_TEST
	-DUSE_TEST3_ENDPOINTS
	-DFFP_ENABLE_DANGEROUS_ENDPOINTS
	-DOLED_DIAGNOSTIC
	-DCORE_DEBUG_LEVEL=1
	-DLOG_LEVEL=5
	-DENABLE_SENSOR_LOGS=1
	-DENABLE_SERIAL_MONITOR=1
	-USILENT_MODE
monitor_filters = time

[env:wroom-s3-test-devkit]
extends = env:wroom-s3-base
platform = platformio/espressif32@6.13.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = config/partitions/partitions_esp32_s3_8mb.csv
custom_sdkconfig = file://sdkconfig_s3_wdt_8mb.txt
lib_ignore = LittleFS
build_flags = 
	${env:wroom-s3-base.build_flags}
	-DCONFIG_LITTLEFS_PAGE_SIZE=256
	-DPROFILE_TEST
	-DUSE_TEST3_ENDPOINTS
	-DFFP_ENABLE_DANGEROUS_ENDPOINTS
	-DOLED_DIAGNOSTIC
	-DCORE_DEBUG_LEVEL=1
	-DLOG_LEVEL=5
	-DENABLE_SENSOR_LOGS=1
	-DENABLE_SERIAL_MONITOR=1
	-USILENT_MODE
monitor_filters = time

[env:wroom-s3-test-usb]
extends = env:wroom-s3-test
upload_protocol = esp-builtin
debug_tool = esp-builtin
build_flags = 
	${env:wroom-s3-test.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1
monitor_filters = time

[env:wroom-s3-prod]
extends = env:wroom-s3-base
lib_ignore = WebServer, ESPAsyncWebServer, WebSockets, LittleFS
build_flags = 
	${env:wroom-s3-base.build_flags}
	-DCONFIG_LITTLEFS_PAGE_SIZE=256
	-DPROFILE_PROD
	-DDISABLE_ASYNC_WEBSERVER
	-DENABLE_SERIAL_MONITOR=0
	-DENABLE_SENSOR_LOGS=0
	-DCORE_DEBUG_LEVEL=0
	-DLOG_LEVEL=0
	-DUSE_AIR_SENSOR_AUTO

; v13.81: profil HTTPS conserve mais bloque par garde-fou de compilation tant que
; WebClient POST/GET/heartbeat n'a pas de transport TLS valide (evite firmware muet).
[env:wroom-prod-https]
extends = env:wroom-prod
build_flags = 
	${env:wroom-prod.build_flags}
	-DUSE_HTTPS_ENDPOINTS
	-DFFP5CS_WEBCLIENT_TLS_READY
	; Pilote HTTPS métier (WiFiClientSecure + TLSMutex). wroom-prod inchangé (HTTP).
	; Valider sur banc avant flash terrain : heap ~35 Ko TLS, pas de SMTP concurrent.

[env:wroom-beta]
extends = env:wroom-prod
; Beta : serial + CORE_DEBUG_LEVEL=1 → ~6 pt de plus que prod ; garde-fou relevé (86 %).
custom_flash_budget_pct = 86
build_flags = 
	${env:wroom-prod.build_flags}
	-UPROFILE_PROD
	-DPROFILE_BETA
	-DUSE_TEST_ENDPOINTS
	-UENABLE_SERIAL_MONITOR
	-DENABLE_SERIAL_MONITOR=1
	-UCORE_DEBUG_LEVEL
	-DCORE_DEBUG_LEVEL=1
monitor_filters = time

; Tests contre serveur Docker LAN : include/local_server_overrides.h + doc WROOM_BETA_LOCAL_BUILD_FLASH_TEST.md
; Partition medium (0x0B0000 LittleFS) + web async : data/ ~220 Ko ne tient pas dans ota_fs_mail (64 Ko).
[env:wroom-beta-local]
extends = env:wroom-beta
upload_speed = 115200
upload_resetmethod = cketch
board_build.partitions = config/partitions/partitions_esp32_wroom_ota_fs_medium.csv
; beta-local réactive le web async (-UDISABLE_ASYNC_WEBSERVER) : il faut donc
; rendre à nouveau disponibles ESPAsyncWebServer/WebSockets, ignorés en héritant
; de wroom-prod (async off). On rétablit le lib_ignore de wroom-test (LittleFS seul).
lib_ignore = LittleFS
build_flags =
	${env:wroom-beta.build_flags}
	-DUSE_LOCAL_SERVER_ENDPOINTS
	-UDISABLE_ASYNC_WEBSERVER

[env:wroom-tls-test]
board = esp32dev
board_build.partitions = config/partitions/partitions_esp32_wroom_test.csv
build_flags = 
	${env.build_flags}
	-DBOARD_WROOM
	-DPROFILE_TEST
	-DENABLE_SERIAL_MONITOR=1
	-DCORE_DEBUG_LEVEL=5
	-DLOG_LEVEL=5
	-DFFP5CS_COREDUMP_ENABLE=0
build_src_filter = 
	-<*>
	+<tls_minimal_test.cpp>
upload_speed = 115200
monitor_filters = time
