name: Firmware CI

# CI racine pour n3_firmwires (aucune CI active auparavant : les workflows sous
# ffp5cs/.github/ ne sont pas pris en compte par GitHub car hors racine).
# Compile les firmwares et lance les tests natifs sur chaque push/PR.
# Secrets : credentials.h (n3pp/msp/upload) provisionné depuis l'exemple ;
# ffp5cs/include/secrets.h est auto-créé par son pre-script pio_ensure_secrets.py.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Tests natifs (Unity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('**/platformio*.ini') }}
          restore-keys: pio-native-
      - name: shared/ (n3_analog_sensors, n3_hmac, n3_notify, n3_mail, n3_data, n3_net_stats, n3_tracker)
        run: |
          cd shared/tests_native
          for s in test_analog test_hmac test_notify test_mail test_data test_net_stats test_tracker; do
            echo "::group::$s"
            pio test -c platformio-native.ini -e native -f "$s"
            echo "::endgroup::"
          done
      - name: ffp5cs (suite par suite)
        run: |
          cd ffp5cs
          for s in test_nvs test_config test_server_url test_sensor_validation test_feeding_slots test_post_body test_gpio_mapping test_sensor_fallback test_ota_select test_gpio_lookup test_sensor_map test_data_queue test_display_cache test_ota_config test_utils test_gpio_registry test_server_hostname test_ultrasonic_filter test_ota_url test_sd_queue_path test_epoch_util test_flood_alert test_reservoir_low_security test_heater_hysteresis test_level_alert test_iactuators test_actuator_snapshot test_feeding_timing test_feeding_command_resolver test_threshold_util test_refill_start test_refill_duration test_refill_efficiency test_refill_overfill test_refill_recovery test_imailer test_heater_orchestrator test_level_alert_orchestrator test_flood_orchestrator test_feeding_finalize test_sleep_blocking test_clock_decision test_login_throttle test_diagnostics_decision test_gpio_bool_parse test_board_traits_default test_board_traits_s3beta test_tank_level_gate test_uptime_format test_wifi_disconnect_reason; do
            echo "::group::$s"
            pio test -c platformio-native.ini -e native -f "$s"
            echo "::endgroup::"
          done
      - name: poissonglouton (suite par suite)
        run: |
          cd poissonglouton
          for s in test_journal_logic test_counter test_detection_fusion test_detection_poll; do
            echo "::group::$s"
            pio test -c platformio-native.ini -e native -f "$s"
            echo "::endgroup::"
          done

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: n3pp, dir: n3pp, env: esp32dev }
          - { name: msp, dir: msp, env: esp32dev }
          # Compile-check de la variante HTTPS (TLS) opt-in (flag USE_HTTPS_ENDPOINTS).
          # Detecte les erreurs de compilation du chemin WiFiClientSecure sans
          # toucher aux builds HTTP par defaut ci-dessus. uploadphotosserver (msp1/n3pp/ffp3)
          # compile aussi en HTTPS + esp32cam (PSRAM) — cf. docs/HTTPS_MIGRATION.md.
          - { name: n3pp-https, dir: n3pp, env: n3pp-https }
          - { name: msp-https, dir: msp, env: msp-https }
          - { name: ffp5cs-wroom-test, dir: ffp5cs, env: wroom-test }
          # ffp5cs S3 réactivé : l'incompat ESP32Servo@3.0.5 (arduino-esp32 3.x)
          # vs le platform S3 espressif32@6.13.0 (arduino-esp32 2.0.x, 'note_t' non
          # déclaré dans ESP32PWM.h) est levée en rétrogradant la lib servo à 1.2.1
          # pour le seul périmètre S3 (cf. [env:wroom-s3-base] dans ffp5cs/platformio.ini).
          - { name: ffp5cs-wroom-s3-test, dir: ffp5cs, env: wroom-s3-test }
          # Variantes S3 (PROFILE_TEST) : PSRAM (+ patch IWDT), sans patch, DevKit 8 Mo,
          # USB-JTAG. Toutes bénéficient de la rétrogradation servo 1.2.1 (wroom-s3-base).
          - { name: ffp5cs-wroom-s3-test-psram, dir: ffp5cs, env: wroom-s3-test-psram }
          - { name: ffp5cs-wroom-s3-test-psram-v2, dir: ffp5cs, env: wroom-s3-test-psram-v2 }
          - { name: ffp5cs-wroom-s3-test-devkit, dir: ffp5cs, env: wroom-s3-test-devkit }
          - { name: ffp5cs-wroom-s3-test-usb, dir: ffp5cs, env: wroom-s3-test-usb }
          # Diagnostic TLS minimal (compile tls_minimal_test.cpp seul).
          - { name: ffp5cs-wroom-tls-test, dir: ffp5cs, env: wroom-tls-test }
          # Canal OTA BETA (WROOM pioarduino, PROFILE_BETA) : web async désactivé (hérité
          # de wroom-prod), donc taille proche de prod. wroom-beta-local n'est PAS en CI
          # (voir NB ci-dessous : débordement de partition).
          - { name: ffp5cs-wroom-beta, dir: ffp5cs, env: wroom-beta }
          # Envs PROFILE_PROD : compile-check activé via le WEB_AUTH factice provisionné
          # ci-dessous (lève le static_assert). wroom-prod = pioarduino ; pio6/s3-prod = registre.
          - { name: ffp5cs-wroom-prod, dir: ffp5cs, env: wroom-prod }
          - { name: ffp5cs-wroom-prod-pio6, dir: ffp5cs, env: wroom-prod-pio6 }
          - { name: ffp5cs-wroom-s3-prod, dir: ffp5cs, env: wroom-s3-prod }
          # NB : restent hors CI par des contraintes pré-existantes propres à l'env :
          #  - wroom-prod-https : #error volontaire (server_url_config.h) bloquant
          #    USE_HTTPS_ENDPOINTS tant que le transport TLS du WebClient n'est pas implémenté.
          #  - wroom-beta-local : réactive le web async ; le fix lib_ignore=LittleFS
          #    (platformio.ini) lève l'erreur de compilation, mais le binaire résultant
          #    (~2,0 Mo) déborde sa partition app 'medium' (1,66 Mo) — nécessite un
          #    re-partitionnement ou une réduction du binaire, hors périmètre CI.
          - { name: poissonglouton-headless, dir: poissonglouton, env: pgl-s3-headless }
          - { name: poissonglouton-display, dir: poissonglouton, env: pgl-s3-display }
          - { name: poissonglouton-display-https, dir: poissonglouton, env: pgl-s3-display-https }
          - { name: poissonglouton-headless-https, dir: poissonglouton, env: pgl-s3-headless-https }
          - { name: uploadphotosserver-msp1, dir: uploadphotosserver, env: msp1 }
          - { name: uploadphotosserver-n3pp, dir: uploadphotosserver, env: n3pp }
          - { name: uploadphotosserver-ffp3, dir: uploadphotosserver, env: ffp3 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --upgrade platformio intelhex  # intelhex requis par le build S3 (espressif32@6.13.0)
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: pio-
      - name: Provision credentials/secrets (placeholders CI)
        run: |
          cp credentials.h.example credentials.h
          # ffp5cs : secrets_config.h est gitignoré ; le fournir depuis l'exemple
          # (sinon include/config.h échoue : API_KEY auto-référence + secrets_config.h absent).
          if [ -f ffp5cs/include/secrets_config.h.example ]; then
            cp ffp5cs/include/secrets_config.h.example ffp5cs/include/secrets_config.h
            # WEB_AUTH_PASS non-placeholder (valeur CI jetable, jamais un vrai secret) :
            # lève le static_assert PROFILE_PROD (config_network.h) pour compile-checker
            # les envs prod. Contourne le garde-fou UNIQUEMENT en CI.
            cat >> ffp5cs/include/secrets_config.h <<'EOF'

          // [CI] WEB_AUTH factice pour lever le static_assert PROFILE_PROD (compile-check).
          namespace Secrets {
          constexpr const char* WEB_AUTH_USER = "ci";
          constexpr const char* WEB_AUTH_PASS = "ci_dummy_web_auth_not_a_secret";
          }
          #define SECRETS_INCLUDE_WEB_AUTH 1
          EOF
          fi
      - name: Build ${{ matrix.name }} (${{ matrix.env }})
        run: cd ${{ matrix.dir }} && pio run -e ${{ matrix.env }}
