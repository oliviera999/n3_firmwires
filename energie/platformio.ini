; Banc d'essai energie — INA226 (panneau solaire / batterie / consommation)
; Carte : ESP32-S3-DevKitC-1 N16R8 (module du profil S3 de ffp5cs), cablage
; compatible carte porteuse n3-universal (I2C SDA 8 / SCL 9, GATE +3V3_SW = GPIO3).
; Serveur : famille « energie » (n3_serveur) — /energie-test/ (banc) ou /energie/.
;
; Toolchain alignee sur la cible ffp5cs S3 : platformio/espressif32@6.13.0
; (arduino-esp32 2.0.17), SANS le custom_sdkconfig ni les scripts propres a
; ffp5cs (build rapide, aucune dependance croisee entre firmwares).
;
; Build : cd energie && pio run -e s3-bench   (credentials.h a la racine du depot)

[platformio]
default_envs = s3-bench

[env]
platform = platformio/espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = partitions_s3_16mb.csv
upload_speed = 921600
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_extra_dirs = ../shared
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-I../
	-Iinclude
	; Serial sur le port USB « UART » du DevKit (comme ffp5cs wroom-s3-*)
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
lib_deps =
	bblanchon/ArduinoJson@7.4.3
	arduino-libraries/Arduino_JSON@0.2.0
	fbiego/ESP32Time@2.0.6
	adafruit/Adafruit GFX Library@1.12.5
	adafruit/Adafruit SSD1306@2.5.16
	adafruit/Adafruit BusIO@1.17.4
	mobizt/ESP Mail Client@3.4.24

; Banc d'essai (defaut) : POST vers /energie-test/, canal OTA test.
[env:s3-bench]
build_flags =
	${env.build_flags}
	-DTEST_MODE

; Compile-check TLS (WiFiClientSecure) du banc.
[env:s3-bench-https]
extends = env:s3-bench
build_flags =
	${env:s3-bench.build_flags}
	-DUSE_HTTPS_ENDPOINTS

; Futur module reel : POST vers /energie/ (tables de production), canal OTA prod.
[env:s3-prod]
build_flags =
	${env.build_flags}
	-DUSE_HTTPS_ENDPOINTS
