; PlatformIO — firmware ESP32-CAM unifié (msp1, n3pp, ffp3)
; Matériel cible : module AI Thinker (ESP32-D0WD, flash 4 Mo, PSRAM QSPI, OV2640, SD).
; Stack unique : espressif32@6.13 + board esp32cam (PSRAM + psramFound()) + HTTPS (USE_HTTPS_ENDPOINTS).
; Pins caméra / LED : include/config.h.
; Ne pas coder en dur upload_port / monitor_port.
; Build Windows : C:\pio-builds\uploadphotosserver\<env>\ (pio_redirect_build_dir.py).

[platformio]
default_envs = msp1

[env:cam-base]
platform = platformio/espressif32@6.13.0
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; ESP32-CAM + pont USB-série : DTR/RTS off → évite reset/bootloader et moniteur vide.
monitor_rts = 0
monitor_dtr = 0
board_build.partitions = ../config/partitions/min_spiffs.csv
extra_scripts =
	pre:../scripts/pio_redirect_build_dir.py
	pre:tools/pio_ensure_credentials.py
	pre:../scripts/pio_patch_esp_mail_fs_spiffs.py
build_flags =
	-I $PROJECT_DIR/..
	-I $PROJECT_DIR/include
	-mfix-esp32-psram-cache-issue
	-std=gnu++17
	-DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768
	-DUSE_HTTPS_ENDPOINTS
	; n3_log : CORE_DEBUG_LEVEL n'est pas defini pour cet env -> le defaut tomberait
	; a INFO et masquerait tous les logs DEBUG. On force VERBOSE pour une iso-emission
	; stricte apres migration des Serial.print vers shared/n3_log (T5).
	-DN3_LOG_LEVEL=N3LOG_VERBOSE
build_src_filter = +<*> -<gcc_atomic_compat.c>
lib_extra_dirs = ../shared
lib_deps =
	bblanchon/ArduinoJson@7.4.3
	arduino-libraries/Arduino_JSON@0.2.0
	fbiego/ESP32Time@2.0.6
	mobizt/ESP Mail Client@3.4.24

[env:msp1]
extends = env:cam-base
build_flags =
	${env:cam-base.build_flags}
	-DTARGET_MSP1

[env:n3pp]
extends = env:cam-base
build_flags =
	${env:cam-base.build_flags}
	-DTARGET_N3PP

[env:ffp3]
extends = env:cam-base
; CH340 sans auto-bootloader : BOOT+RST puis upload (--before=no_reset).
upload_flags =
	--before=no_reset
build_flags =
	${env:cam-base.build_flags}
	-DTARGET_FFP3
