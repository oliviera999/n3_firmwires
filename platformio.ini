; Fichier factice pour activer l'integration PlatformIO dans Cursor
; (barre d'etat + commandes plugin) depuis la racine du submodule.
; Cette racine contient plusieurs projets PlatformIO distincts.

[platformio]
description = n3_firmwires root placeholder for Cursor PlatformIO plugin
default_envs = fake

; Monitoring manuel depuis la racine (plugin PlatformIO / pio device monitor)
[env]
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

[env:fake]
platform = native
framework = arduino
build_type = debug
